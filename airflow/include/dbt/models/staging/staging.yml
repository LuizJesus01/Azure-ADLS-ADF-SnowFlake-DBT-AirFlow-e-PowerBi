version: 2

models:
# ============================================================
  - name: stg_customers
    description: >
      Dados de clientes tratados a partir da camada RAW.
      O modelo extrai os atributos armazenados originalmente em JSON/VARIANT,
      padroniza cidade e estado e preserva o CEP como texto para evitar
      perda de zeros à esquerda.

    columns:
      - name: customer_id
        description: >
          Identificador do cliente associado a um pedido.
        data_tests:
          - unique
          - not_null

      - name: customer_unique_id
        description: >
          Identificador persistente utilizado para reconhecer o mesmo
          cliente em diferentes pedidos.
        data_tests:
          - not_null

      - name: customer_zip_code_prefix
        description: >
          Prefixo de cinco dígitos do CEP do cliente, armazenado como texto.

      - name: customer_city
        description: >
          Cidade do cliente padronizada em letras minúsculas.

      - name: customer_state
        description: >
          Sigla da unidade federativa do cliente padronizada em letras maiúsculas.
        data_tests:
          - not_null
# ============================================================
  - name: stg_orders
    description: >
      Pedidos tratados e tipados da camada Silver.
      Contém o ciclo de vida do pedido desde sua criação até a entrega,
      incluindo datas de aprovação, envio e prazo estimado.

    columns:
      - name: order_id
        description: >
          Identificador único do pedido.
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: >
          Identificador do cliente associado ao pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

      - name: order_status
        description: >
          Status do pedido padronizado em letras minúsculas.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - approved
                  - canceled
                  - created
                  - delivered
                  - invoiced
                  - processing
                  - shipped
                  - unavailable

      - name: order_purchase_timestamp
        description: >
          Data e hora em que o pedido foi realizado.
        data_tests:
          - not_null

      - name: order_approved_at
        description: >
          Data e hora em que o pagamento do pedido foi aprovado.

      - name: order_delivered_carrier_date
        description: >
          Data e hora em que o pedido foi entregue à transportadora.

      - name: order_delivered_customer_date
        description: >
          Data e hora em que o pedido foi entregue ao cliente.

      - name: order_estimated_delivery_date
        description: >
          Data estimada de entrega informada ao cliente.
        data_tests:
          - not_null
# ============================================================
  - name: stg_order_items
    description: >
      Itens individuais dos pedidos. Um pedido pode possuir múltiplos itens,
      portanto a granularidade do modelo é definida pela combinação
      order_id e order_item_id.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - order_item_id

    columns:
      - name: order_id
        description: >
          Identificador do pedido ao qual o item pertence.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: order_item_id
        description: >
          Número sequencial do item dentro do pedido.
        data_tests:
          - not_null

      - name: product_id
        description: >
          Identificador do produto adquirido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        description: >
          Identificador do vendedor responsável pelo item.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_sellers')
                field: seller_id

      - name: shipping_limit_date
        description: >
          Data limite para o vendedor realizar o envio do produto.

      - name: price
        description: >
          Valor de venda do item, sem considerar o frete.
        data_tests:
          - not_null

      - name: freight_value
        description: >
          Valor do frete associado ao item.
        data_tests:
          - not_null
# ============================================================
  - name: stg_payments
    description: >
      Pagamentos dos pedidos extraídos da estrutura JSON da camada RAW.
      Um pedido pode possuir múltiplas formas ou sequências de pagamento.
      A granularidade é definida por order_id e payment_sequential.

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_id
              - payment_sequential

    columns:
      - name: order_id
        description: >
          Identificador do pedido relacionado ao pagamento.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: payment_sequential
        description: >
          Número sequencial do pagamento dentro do pedido.
        data_tests:
          - not_null

      - name: payment_type
        description: >
          Meio de pagamento utilizado pelo cliente.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - boleto
                  - credit_card
                  - debit_card
                  - not_defined
                  - voucher

      - name: payment_installments
        description: >
          Quantidade de parcelas utilizadas no pagamento.
        data_tests:
          - not_null

      - name: payment_value
        description: >
          Valor monetário do pagamento.
        data_tests:
          - not_null
# ============================================================
  - name: stg_products
    description: >
      Cadastro de produtos tratado na camada Silver.
      Corrige nomes inconsistentes da origem e converte atributos
      numéricos para tipos adequados.

    columns:
      - name: product_id
        description: >
          Identificador único do produto.
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: >
          Categoria do produto em português.

      - name: product_name_length
        description: >
          Quantidade de caracteres do nome do produto.
          Corrige o nome PRODUCT_NAME_LENGHT existente na camada RAW.

      - name: product_description_length
        description: >
          Quantidade de caracteres da descrição do produto.
          Corrige o nome PRODUCT_DESCRIPTION_LENGHT existente na camada RAW.

      - name: product_photos_qty
        description: >
          Quantidade de fotos cadastradas para o produto.

      - name: product_weight_g
        description: >
          Peso do produto em gramas.

      - name: product_length_cm
        description: >
          Comprimento do produto em centímetros.

      - name: product_height_cm
        description: >
          Altura do produto em centímetros.

      - name: product_width_cm
        description: >
          Largura do produto em centímetros.
# ============================================================
  - name: stg_sellers
    description: >
      Cadastro de vendedores padronizado para consumo analítico.
      O CEP é preservado como texto e cidade e estado são normalizados.

    columns:
      - name: seller_id
        description: >
          Identificador único do vendedor.
        data_tests:
          - unique
          - not_null

      - name: seller_zip_code_prefix
        description: >
          Prefixo de cinco dígitos do CEP do vendedor.

      - name: seller_city
        description: >
          Cidade do vendedor padronizada em letras minúsculas.

      - name: seller_state
        description: >
          Sigla da unidade federativa do vendedor em letras maiúsculas.
        data_tests:
          - not_null
# ============================================================
  - name: stg_reviews
    description: >
      Avaliações de clientes extraídas da estrutura JSON da camada RAW.
      Contém notas, comentários e timestamps relacionados às avaliações
      dos pedidos.

    columns:
      - name: review_id
        description: >
          Identificador da avaliação.
        data_tests:
          - not_null

      - name: order_id
        description: >
          Identificador do pedido avaliado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: review_score
        description: >
          Nota atribuída pelo cliente ao pedido, variando de 1 a 5.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 5

      - name: review_comment_title
        description: >
          Título opcional informado pelo cliente na avaliação.

      - name: review_comment_message
        description: >
          Comentário opcional informado pelo cliente na avaliação.

      - name: review_creation_date
        description: >
          Data de criação da avaliação.

      - name: review_answer_timestamp
        description: >
          Data e hora de resposta ou envio da avaliação.
# ============================================================
  - name: stg_category_translation
    description: >
      Tabela de referência que relaciona as categorias de produtos
      em português às respectivas traduções para inglês.

    columns:
      - name: product_category_name
        description: >
          Nome da categoria do produto em português.
        data_tests:
          - unique
          - not_null

      - name: product_category_name_english
        description: >
          Tradução da categoria do produto para inglês.
        data_tests:
          - not_null
# ============================================================
  - name: stg_geolocation
    description: >
      Dados geográficos tratados a partir da base de geolocalização do Olist.
      Um mesmo prefixo de CEP pode aparecer múltiplas vezes com diferentes
      coordenadas e localidades, portanto o CEP não é considerado uma
      chave única neste modelo.

    columns:
      - name: geolocation_zip_code_prefix
        description: >
          Prefixo de cinco dígitos do CEP associado à localização.
        data_tests:
          - not_null

      - name: geolocation_lat
        description: >
          Latitude da localização geográfica.
        data_tests:
          - not_null

      - name: geolocation_lng
        description: >
          Longitude da localização geográfica.
        data_tests:
          - not_null

      - name: geolocation_city
        description: >
          Cidade associada às coordenadas geográficas.

      - name: geolocation_state
        description: >
          Sigla da unidade federativa associada à localização.